<div class="row about-container" data-anime="up">
    <div class="col-md-12">
        <div class="about-card">
            <div class="row">
                
                <!-- Left Section: Image & Bio (col-lg-7) -->
                <div class="col-lg-7 mb-4 mb-lg-0">
                    <div class="row align-items-center h-100">
                        <!-- Image Column -->
                        <div class="col-md-4 text-center mb-4 mb-md-0">
                            <div class="image-wrapper">
                                <img src="assets/img/iago-rhuda-ramos.png" class="img-fluid profile-img"
                                    [alt]="'PHOTO_ALT' | translate">
                            </div>
                        </div>

                        <!-- Bio Content -->
                        <div class="col-md-8">
                            <h2 class="section-title">{{ 'ABOUT' | translate }}</h2>
                            <p class="about-text main-intro" [innerHTML]="'ABOUT ME' | translate"></p>

                            <div class="info-grid">
                                <div class="info-item">
                                    <span class="label"><i class="bi bi-calendar-event"></i> {{ 'AGE' | translate }}:</span>
                                    <span class="value">{{ calculateAge() }} {{ 'YEARS' | translate }}</span>
                                </div>
                                <div class="info-item">
                                    <span class="label"><i class="bi bi-geo-alt-fill text-danger"></i> {{ 'LOCATION_LABEL' | translate }}:</span>
                                    <span class="value">{{ 'LOCATION_VALUE' | translate }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Section: Hobbies Grid (col-lg-5) -->
                <div class="col-lg-5 hobbies-section mt-0">
                    <h3 class="subsection-title">{{ 'HOBBIES' | translate }}</h3>

                    <!-- Unified Hobbies Container -->
                    <div class="hobbies-container">
                        <div class="hobby-card" *ngFor="let hobby of hobbies">
                            <div class="hobby-header">
                                <i class="bi" [ngClass]="hobby.icon"></i>
                                <span>{{ hobby.key | translate }}</span>
                            </div>
                            <div class="hobby-topics">
                                <div class="topic-item" *ngFor="let topic of hobby.topics">
                                    <span class="topic-label">{{ topic.label | translate }}:</span>
                                    <span class="topic-value">{{ topic.value | translate }}</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
</div>
